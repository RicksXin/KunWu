<!DOCTYPE html>
<!--
  Web Mobile 构建模板（PRD-10 §2、PRD-09 §2、任务 P0-TECH-001）。

  为何需要覆盖默认模板：竖屏锁定、安全区启用、像素图渲染这三件事
  只能在 HTML/CSS 层表达，引擎配置管不到。

  **本文件是静态复制，不做模板替换**——web-mobile 平台不处理 <%= %> 占位符，
  写了会原样出现在产物里。因此结构必须与默认产物一致：
    GameDiv > Cocos3dGameContainer > canvas
    polyfills.bundle.js → system.bundle.js → import-map.json → System.import('./index.js')
  改动这段会白屏。
-->
<html>
<head>
    <meta charset="utf-8">
    <title>昆吾禁地</title>

    <!--
      viewport-fit=cover 是安全区的前提：不加它 env(safe-area-inset-*) 恒为 0，
      ViewportAdapter 就读不到刘海尺寸（见 readCssSafeAreaInsets）。
      user-scalable=no 防止双指缩放破坏像素对齐。
    -->
    <meta name="viewport"
          content="width=device-width,user-scalable=no,initial-scale=1,minimum-scale=1,maximum-scale=1,minimal-ui=true,viewport-fit=cover"/>

    <!-- iOS Safari 全屏与状态栏 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">

    <!-- 强制 webkit 内核（360、QQ 浏览器等双核浏览器） -->
    <meta name="renderer" content="webkit"/>
    <meta name="force-rendering" content="webkit"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <meta name="msapplication-tap-highlight" content="no">

    <!-- 全屏 -->
    <meta name="full-screen" content="yes"/>
    <meta name="x5-fullscreen" content="true"/>
    <meta name="360-fullscreen" content="true"/>
    <meta name="x5-page-mode" content="app">

    <!-- 竖屏首发（PRD-00 §3）。方向锁定在文末的 JS 中执行。 -->
    <meta name="screen-orientation" content="portrait">
    <meta name="x5-orientation" content="portrait">
    <meta name="theme-color" content="#0d0b0f">

    <link rel="stylesheet" type="text/css" href="style.css"/>
</head>
<body>
    <!-- 这三层容器的 id 与属性被引擎的适配代码依赖，不要改名或去掉 -->
    <div id="GameDiv" cc_exact_fit_screen="true">
        <div id="Cocos3dGameContainer">
            <canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="99"></canvas>
        </div>
    </div>

    <!--
      启动失败兜底：WebGL 不可用或引擎启动异常时，玩家至少看到原因而非黑屏
      （PRD-10 §8：显示错误码）。
    -->
    <div id="kw-boot-error" hidden>
        <div class="kw-boot-error__panel">
            <h1>无法启动</h1>
            <p id="kw-boot-error__reason"></p>
            <p class="kw-boot-error__hint">请尝试刷新页面，或更换为最新版 Chrome / Safari。</p>
        </div>
    </div>

    <script>
    (function () {
        'use strict';

        var errorBox = document.getElementById('kw-boot-error');
        var reasonEl = document.getElementById('kw-boot-error__reason');

        window.__kunwuShowBootError = function (reason) {
            if (!errorBox || !reasonEl) {
                return;
            }
            reasonEl.textContent = reason;
            errorBox.hidden = false;
        };

        /**
         * WebGL 可用性预检（PRD-10 §1：WebGL 成熟路径，不依赖 WebGPU）。
         * 在引擎启动前检测，避免玩家只看到黑屏。
         */
        try {
            var probe = document.createElement('canvas');
            var gl = probe.getContext('webgl2') || probe.getContext('webgl') ||
                     probe.getContext('experimental-webgl');
            if (!gl) {
                window.__kunwuShowBootError('浏览器不支持 WebGL（错误码 TECH-001-WEBGL）。');
            }
        } catch (error) {
            window.__kunwuShowBootError('WebGL 初始化失败（错误码 TECH-001-WEBGL）。');
        }

        // IndexedDB 缺失不阻断启动：存档层会降级到内存后端并提示导出
        // （PRD-10 §8：IndexedDB 失败保留内存状态并提示导出）。
        if (typeof indexedDB === 'undefined') {
            console.warn('[KunWu] IndexedDB 不可用，存档将只保留在内存中');
        }

        /**
         * 竖屏锁定。
         * Screen Orientation API 只在全屏或已安装的 PWA 下生效，
         * 普通浏览器标签页会被拒绝——故失败只忽略，由 CSS 兜底提示。
         */
        function lockPortrait() {
            var orientation = window.screen && window.screen.orientation;
            if (!orientation || typeof orientation.lock !== 'function') {
                return;
            }
            var result = orientation.lock('portrait');
            if (result && typeof result.catch === 'function') {
                result.catch(function () {
                    // 非全屏状态下被拒是预期行为，不必打扰玩家
                });
            }
        }
        document.addEventListener('fullscreenchange', lockPortrait);
        lockPortrait();
    })();
    </script>

    <!-- 以下四段为引擎启动链，顺序不可调整 -->
    <script src="src/polyfills.bundle.js" charset="utf-8"> </script>
    <script src="src/system.bundle.js" charset="utf-8"> </script>
    <script src="src/import-map.json" type="systemjs-importmap" charset="utf-8"> </script>

    <script>
        System.import('./index.js').catch(function (err) {
            console.error(err);
            if (window.__kunwuShowBootError) {
                window.__kunwuShowBootError('引擎启动失败（错误码 TECH-001-BOOT）：' + err);
            }
        });
    </script>
</body>
</html>
